<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Comercial Jenk Cáceres</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c0527a">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/cuenta.css">
</head>
<body>
  <site-header></site-header>
  <main id="contenido" class="wrap">
    <section class="auth" aria-labelledby="t-auth">
      <div class="auth-aside">
        <h1 id="t-auth">Crea tu cuenta</h1>
        <p>Solo necesitas tu nombre, tu correo y una contraseña.</p>
        <i class="bead" aria-hidden="true"></i>
      </div>
      <div class="auth-card">
        <form id="form-registro" novalidate>
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="80" required aria-describedby="nombre-error">
            <p class="field-error" id="nombre-error" hidden></p>
          </div>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="120" required aria-describedby="email-error">
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-group">
              <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="password-hint password-error">
              <button type="button" class="input-action" data-toggle-password="password" aria-controls="password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <p class="hint" id="password-hint">Mínimo 8 caracteres.</p>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <div class="field">
            <label for="password2">Repite la contraseña</label>
            <div class="input-group">
              <input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="password2-error">
              <button type="button" class="input-action" data-toggle-password="password2" aria-controls="password2" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <p class="field-error" id="password2-error" hidden></p>
          </div>
          <p class="form-error" role="alert"></p>
          <button class="primary-btn" type="submit">Crear cuenta</button>
          <p class="auth-switch">¿Ya tienes cuenta? <a href="/cuenta/login.html" data-carry-next>Ingresa</a></p>
        </form>
      </div>
    </section>
  </main>
  <site-footer></site-footer>
  <script type="module" src="/js/components/header.js"></script>
  <script type="module" src="/js/components/footer.js"></script>
  <script type="module" src="/js/pages/registro.js"></script>
</body>
</html>
