<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Comercial Jenk Cáceres</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c0527a">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/cuenta.css">
</head>
<body>
  <site-header></site-header>
  <main id="contenido" class="wrap">
    <section class="auth" aria-labelledby="t-auth">
      <div class="auth-aside">
        <h1 id="t-auth">Hola de nuevo</h1>
        <p>Ingresa con tu correo para continuar tu compra.</p>
        <i class="bead" aria-hidden="true"></i>
      </div>
      <div class="auth-card">
        <form id="form-login" novalidate>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="120" required aria-describedby="email-error">
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-group">
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-error">
              <button type="button" class="input-action" data-toggle-password="password" aria-controls="password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <p class="form-error" role="alert"></p>
          <button class="primary-btn" type="submit">Ingresar</button>
          <p class="auth-switch">¿Primera vez aquí? <a href="/cuenta/registro.html" data-carry-next>Crea tu cuenta</a></p>
        </form>
      </div>
    </section>
  </main>
  <site-footer></site-footer>
  <script type="module" src="/js/components/header.js"></script>
  <script type="module" src="/js/components/footer.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
